name: clipper-core ci

on:
  pull_request:
    paths:
      - "packages/clipper-core/**"
      - ".github/workflows/clipper-core-ci.yml"
  push:
    paths:
      - "packages/clipper-core/**"
      - ".github/workflows/clipper-core-ci.yml"
  workflow_dispatch:
    inputs:
      run_playwright_integration:
        description: "Run optional Playwright integration test job"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/clipper-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/clipper-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (unit/contract/e2e)
        run: npm test

  playwright-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_playwright_integration == 'true' }}
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: packages/clipper-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/clipper-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright integration contract
        run: RUN_PLAYWRIGHT_INTEGRATION=1 npm run test:integration:playwright
